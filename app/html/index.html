<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="cache-control" content="no-cache">
  <title>Micro VMS</title>
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
</head>
<body>
  <!-- Inline icon sprite: keeps the app self-contained (no icon font, no extra request). -->
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></symbol>
    <symbol id="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
    <symbol id="ic-back-30" viewBox="0 0 24 24"><path d="M11.5 5v14L3 12zM21 5v14l-8.5-7z"/></symbol>
    <symbol id="ic-back-5" viewBox="0 0 24 24"><path d="M14.5 5.5v13L5 12z"/></symbol>
    <symbol id="ic-fwd-30" viewBox="0 0 24 24"><path d="M3 5v14l8.5-7zM12.5 5v14L21 12z"/></symbol>
    <symbol id="ic-camera" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 6h3.2L9 4h6l1.8 2H20a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm8 3.4a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2z"/></symbol>
    <symbol id="ic-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></symbol>
    <symbol id="ic-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></symbol>
    <symbol id="ic-speaker" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-speaker-off" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="logo">◉</span>
      <span data-i18n="app.title">Micro VMS</span>
      <span id="deviceName" class="muted"></span>
    </div>
    <div class="topbar-right">
      <div id="netStatus" class="net-status small muted" data-i18n-title="net.title">
        <span id="netPing" data-i18n="net.ping.none">–</span>
        <span id="netRate" data-i18n="net.rate.none">–</span>
      </div>
      <div id="storageStatus" class="storage muted"></div>
      <div class="lang-switch" data-i18n-title="lang.switch">
        <button data-lang="de">DE</button><button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="viewer">
      <div class="viewer-toolbar">
        <label class="inline" id="layoutWrap">
          <span data-i18n="layout.label">Ansicht</span>
          <select id="layoutSelect">
            <option value="auto" data-i18n="layout.auto">Automatisch</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="6">6</option>
          </select>
        </label>
        <span class="small muted" data-i18n="tile.focusHint"></span>
      </div>

      <div id="videoGrid" class="video-grid layout-1">
        <div class="video-wrap" id="tile0" data-tile="0">
          <video id="video" muted autoplay playsinline></video>
          <div id="modeBadge" class="badge" data-i18n="badge.connecting"></div>
          <div id="clock" class="clock">–</div>
          <div id="videoMsg" class="video-msg hidden" role="status"></div>
          <div id="tileLabel" class="tile-label"></div>
          <div class="tile-tools">
            <button id="tileAudio" class="tile-icon" type="button" aria-pressed="false" data-i18n-title="tile.audio.off">
              <svg class="icon" width="16" height="16"><use id="tileAudioIcon" href="#ic-speaker-off"/></svg>
            </button>
            <details id="tileOptions" class="tile-options">
              <summary class="tile-icon" data-i18n-title="tile.menu">
                <svg class="icon" width="16" height="16"><use href="#ic-more"/></svg>
              </summary>
              <div class="tile-menu-body">
                <label><span data-i18n="tile.channel">Kanal</span>
                  <select id="tileChannel"></select>
                </label>
                <label><span data-i18n="tile.stream">Stream</span>
                  <select id="tileStream"></select>
                </label>
                <label><span data-i18n="ctl.resolution">Auflösung</span>
                  <select id="tileResolution">
                    <option value="" data-i18n="ctl.resolution.default">Standard</option>
                    <option value="1920x1080">1920×1080</option>
                    <option value="1280x720">1280×720</option>
                    <option value="640x360">640×360</option>
                  </select>
                </label>
              </div>
            </details>
          </div>
        </div>
        <div class="video-wrap hidden" id="tile1" data-tile="1">
          <video id="video2" muted autoplay playsinline></video>
          <div id="modeBadge2" class="badge" data-i18n="badge.connecting"></div>
          <div id="clock2" class="clock">–</div>
          <div id="videoMsg2" class="video-msg hidden" role="status"></div>
          <div id="tileLabel2" class="tile-label"></div>
          <div class="tile-tools">
            <button id="tileAudio2" class="tile-icon" type="button" aria-pressed="false" data-i18n-title="tile.audio.off">
              <svg class="icon" width="16" height="16"><use id="tileAudioIcon2" href="#ic-speaker-off"/></svg>
            </button>
            <details id="tileOptions2" class="tile-options">
              <summary class="tile-icon" data-i18n-title="tile.menu">
                <svg class="icon" width="16" height="16"><use href="#ic-more"/></svg>
              </summary>
              <div class="tile-menu-body">
                <label><span data-i18n="tile.channel">Kanal</span>
                  <select id="tileChannel2"></select>
                </label>
                <label><span data-i18n="tile.stream">Stream</span>
                  <select id="tileStream2"></select>
                </label>
                <label><span data-i18n="ctl.resolution">Auflösung</span>
                  <select id="tileResolution2">
                    <option value="" data-i18n="ctl.resolution.default">Standard</option>
                    <option value="1920x1080">1920×1080</option>
                    <option value="1280x720">1280×720</option>
                    <option value="640x360">640×360</option>
                  </select>
                </label>
              </div>
            </details>
          </div>
        </div>
        <div class="video-wrap hidden" id="tile2" data-tile="2">
          <video id="video3" muted autoplay playsinline></video>
          <div id="modeBadge3" class="badge" data-i18n="badge.connecting"></div>
          <div id="clock3" class="clock">–</div>
          <div id="videoMsg3" class="video-msg hidden" role="status"></div>
          <div id="tileLabel3" class="tile-label"></div>
          <div class="tile-tools">
            <button id="tileAudio3" class="tile-icon" type="button" aria-pressed="false" data-i18n-title="tile.audio.off">
              <svg class="icon" width="16" height="16"><use id="tileAudioIcon3" href="#ic-speaker-off"/></svg>
            </button>
            <details id="tileOptions3" class="tile-options">
              <summary class="tile-icon" data-i18n-title="tile.menu">
                <svg class="icon" width="16" height="16"><use href="#ic-more"/></svg>
              </summary>
              <div class="tile-menu-body">
                <label><span data-i18n="tile.channel">Kanal</span>
                  <select id="tileChannel3"></select>
                </label>
                <label><span data-i18n="tile.stream">Stream</span>
                  <select id="tileStream3"></select>
                </label>
                <label><span data-i18n="ctl.resolution">Auflösung</span>
                  <select id="tileResolution3">
                    <option value="" data-i18n="ctl.resolution.default">Standard</option>
                    <option value="1920x1080">1920×1080</option>
                    <option value="1280x720">1280×720</option>
                    <option value="640x360">640×360</option>
                  </select>
                </label>
              </div>
            </details>
          </div>
        </div>
        <div class="video-wrap hidden" id="tile3" data-tile="3">
          <video id="video4" muted autoplay playsinline></video>
          <div id="modeBadge4" class="badge" data-i18n="badge.connecting"></div>
          <div id="clock4" class="clock">–</div>
          <div id="videoMsg4" class="video-msg hidden" role="status"></div>
          <div id="tileLabel4" class="tile-label"></div>
          <div class="tile-tools">
            <button id="tileAudio4" class="tile-icon" type="button" aria-pressed="false" data-i18n-title="tile.audio.off">
              <svg class="icon" width="16" height="16"><use id="tileAudioIcon4" href="#ic-speaker-off"/></svg>
            </button>
            <details id="tileOptions4" class="tile-options">
              <summary class="tile-icon" data-i18n-title="tile.menu">
                <svg class="icon" width="16" height="16"><use href="#ic-more"/></svg>
              </summary>
              <div class="tile-menu-body">
                <label><span data-i18n="tile.channel">Kanal</span>
                  <select id="tileChannel4"></select>
                </label>
                <label><span data-i18n="tile.stream">Stream</span>
                  <select id="tileStream4"></select>
                </label>
                <label><span data-i18n="ctl.resolution">Auflösung</span>
                  <select id="tileResolution4">
                    <option value="" data-i18n="ctl.resolution.default">Standard</option>
                    <option value="1920x1080">1920×1080</option>
                    <option value="1280x720">1280×720</option>
                    <option value="640x360">640×360</option>
                  </select>
                </label>
              </div>
            </details>
          </div>
        </div>
        <div class="video-wrap hidden" id="tile4" data-tile="4">
          <video id="video5" muted autoplay playsinline></video>
          <div id="modeBadge5" class="badge" data-i18n="badge.connecting"></div>
          <div id="clock5" class="clock">–</div>
          <div id="videoMsg5" class="video-msg hidden" role="status"></div>
          <div id="tileLabel5" class="tile-label"></div>
          <div class="tile-tools">
            <button id="tileAudio5" class="tile-icon" type="button" aria-pressed="false" data-i18n-title="tile.audio.off">
              <svg class="icon" width="16" height="16"><use id="tileAudioIcon5" href="#ic-speaker-off"/></svg>
            </button>
            <details id="tileOptions5" class="tile-options">
              <summary class="tile-icon" data-i18n-title="tile.menu">
                <svg class="icon" width="16" height="16"><use href="#ic-more"/></svg>
              </summary>
              <div class="tile-menu-body">
                <label><span data-i18n="tile.channel">Kanal</span>
                  <select id="tileChannel5"></select>
                </label>
                <label><span data-i18n="tile.stream">Stream</span>
                  <select id="tileStream5"></select>
                </label>
                <label><span data-i18n="ctl.resolution">Auflösung</span>
                  <select id="tileResolution5">
                    <option value="" data-i18n="ctl.resolution.default">Standard</option>
                    <option value="1920x1080">1920×1080</option>
                    <option value="1280x720">1280×720</option>
                    <option value="640x360">640×360</option>
                  </select>
                </label>
              </div>
            </details>
          </div>
        </div>
        <div class="video-wrap hidden" id="tile5" data-tile="5">
          <video id="video6" muted autoplay playsinline></video>
          <div id="modeBadge6" class="badge" data-i18n="badge.connecting"></div>
          <div id="clock6" class="clock">–</div>
          <div id="videoMsg6" class="video-msg hidden" role="status"></div>
          <div id="tileLabel6" class="tile-label"></div>
          <div class="tile-tools">
            <button id="tileAudio6" class="tile-icon" type="button" aria-pressed="false" data-i18n-title="tile.audio.off">
              <svg class="icon" width="16" height="16"><use id="tileAudioIcon6" href="#ic-speaker-off"/></svg>
            </button>
            <details id="tileOptions6" class="tile-options">
              <summary class="tile-icon" data-i18n-title="tile.menu">
                <svg class="icon" width="16" height="16"><use href="#ic-more"/></svg>
              </summary>
              <div class="tile-menu-body">
                <label><span data-i18n="tile.channel">Kanal</span>
                  <select id="tileChannel6"></select>
                </label>
                <label><span data-i18n="tile.stream">Stream</span>
                  <select id="tileStream6"></select>
                </label>
                <label><span data-i18n="ctl.resolution">Auflösung</span>
                  <select id="tileResolution6">
                    <option value="" data-i18n="ctl.resolution.default">Standard</option>
                    <option value="1920x1080">1920×1080</option>
                    <option value="1280x720">1280×720</option>
                    <option value="640x360">640×360</option>
                  </select>
                </label>
              </div>
            </details>
          </div>
        </div>
      </div>

      <div id="sourceChoices" class="card hidden" aria-labelledby="sourceChoiceHint">
        <div id="sourceChoiceHint" role="status"></div>
        <div id="sourceChoiceList" class="row"></div>
      </div>
      <div id="manualSourceInfo" class="small muted hidden" role="status"></div>
      <div id="recordingIndicator" class="recording-indicator" role="status" data-i18n="rec.loading"></div>
      <div class="controls">
        <button id="btnLive" class="live-btn" data-i18n-title="live.btn.title" disabled><span id="liveLabel" data-i18n="live.btn"></span></button>
        <span id="liveSep" class="sep"></span>
        <button id="btnBack" data-i18n-title="ctl.back.title">
          <svg class="icon" width="16" height="16"><use href="#ic-back-30"/></svg><span>30 s</span>
        </button>
        <button id="btnBack5" data-i18n-title="ctl.back5.title">
          <svg class="icon" width="16" height="16"><use href="#ic-back-5"/></svg><span>5 s</span>
        </button>
        <button id="btnPause" data-i18n-title="ctl.pause.title">
          <svg class="icon" width="16" height="16"><use id="pauseIcon" href="#ic-pause"/></svg>
        </button>
        <button id="btnFwd" data-i18n-title="ctl.fwd.title">
          <span>30 s</span><svg class="icon" width="16" height="16"><use href="#ic-fwd-30"/></svg>
        </button>
        <button id="btnRetryPlayback" class="hidden" data-i18n="ctl.retryPlayback"></button>
        <span class="sep"></span>
        <button id="btnSnapshot" data-i18n-title="ctl.snapshot.title" disabled>
          <svg class="icon" width="16" height="16"><use href="#ic-camera"/></svg><span data-i18n="ctl.snapshot"></span>
        </button>
      </div>
    </section>

    <section class="timeline-panel">
      <div class="tl-toolbar">
        <button id="btnPrevDay" data-i18n-title="tl.prevDay"><svg class="icon" width="16" height="16"><use href="#ic-chevron-left"/></svg></button>
        <label class="inline"><span data-i18n="tl.day"></span><input type="date" id="dayPicker"></label>
        <button id="btnNextDay" data-i18n-title="tl.nextDay"><svg class="icon" width="16" height="16"><use href="#ic-chevron-right"/></svg></button>
        <button id="btnToday" data-i18n="tl.today"></button>
        <span class="sep"></span>
        <button id="btnZoomOut" data-i18n-title="tl.zoomOut"><svg class="icon" width="16" height="16"><use href="#ic-minus"/></svg></button>
        <button id="btnZoomIn" data-i18n-title="tl.zoomIn"><svg class="icon" width="16" height="16"><use href="#ic-plus"/></svg></button>
        <button id="btnFitDay" data-i18n="tl.fitShort" data-i18n-title="tl.fitDay"></button>
        <span class="sep"></span>
        <button id="btnSelectMode" class="toggle" aria-pressed="false" data-i18n="tl.select" data-i18n-title="tl.select.title"></button>
        <span class="legend">
          <i class="lg continuous"></i><span data-i18n="tl.legend.record"></span>
          <i class="lg triggered"></i><span data-i18n="tl.legend.triggered"></span>
        </span>
      </div>
      <div class="tl-body">
        <div id="tlLabels" class="tl-labels"></div>
        <div class="tl-canvas-wrap">
          <canvas id="timeline"></canvas>
          <div id="tlTooltip" class="tl-tooltip hidden"></div>
        </div>
      </div>
      <div id="timelineStatus" class="tl-status small hidden" role="status"></div>
      <form id="jumpForm" class="row">
        <label class="inline"><span data-i18n="tl.jumpTime"></span><input type="datetime-local" id="jumpTime" step="1" required></label>
        <button type="submit" data-i18n="tl.jump"></button>
      </form>
      <div class="hint muted" data-i18n="tl.hint"></div>
    </section>

    <section class="side">
      <div class="card">
        <h3 data-i18n="exp.title"></h3>
        <label><span data-i18n="exp.from"></span> <input type="datetime-local" id="expStart" step="1"></label>
        <label><span data-i18n="exp.to"></span> <input type="datetime-local" id="expEnd" step="1"></label>
        <details>
          <summary data-i18n="exp.options"></summary>
          <label><span data-i18n="exp.name"></span> <input type="text" id="expName" placeholder="export"></label>
          <label class="inline"><input type="checkbox" id="expMerge" checked> <span data-i18n="exp.merge"></span></label>
          <label class="inline"><input type="checkbox" id="expPwEnable"> <span data-i18n="exp.password"></span></label>
          <label id="expPwRow" class="hidden"><span data-i18n="exp.password.placeholder"></span><input type="password" id="expPw" autocomplete="new-password"></label>
        </details>
        <label class="inline"><input type="checkbox" id="expAudio" checked> <span data-i18n="exp.audio"></span></label>
        <div id="expAudioHint" class="small muted hidden" data-i18n="exp.audio.none"></div>
        <div class="row">
          <button id="btnExport" class="primary" data-i18n="exp.start"></button>
          <button id="btnCancelExport" class="hidden" data-i18n="exp.cancel"></button>
          <button id="btnClearSel" data-i18n="exp.clear"></button>
        </div>
        <div id="expInfo" class="muted small" role="status"></div>
        <ul id="expLinks" class="links"></ul>
      </div>

      <div id="ptzCard" class="card hidden">
        <h3 data-i18n="ptz.title"></h3>
        <div id="ptzHint" class="muted small"></div>
        <div class="ptz-main">
          <div id="ptzPad" class="ptz-pad">
            <button data-dir="-1,1" data-i18n-title="ptz.dir.ul">↖</button>
            <button data-dir="0,1" data-i18n-title="ptz.dir.u">▲</button>
            <button data-dir="1,1" data-i18n-title="ptz.dir.ur">↗</button>
            <button data-dir="-1,0" data-i18n-title="ptz.dir.l">◀</button>
            <button id="ptzHome" data-i18n-title="ptz.home">⌂</button>
            <button data-dir="1,0" data-i18n-title="ptz.dir.r">▶</button>
            <button data-dir="-1,-1" data-i18n-title="ptz.dir.dl">↙</button>
            <button data-dir="0,-1" data-i18n-title="ptz.dir.d">▼</button>
            <button data-dir="1,-1" data-i18n-title="ptz.dir.dr">↘</button>
          </div>
          <div id="ptzZoomRow" class="ptz-zoom">
            <button id="ptzZoomIn" data-i18n-title="ptz.zoomIn">＋</button>
            <span class="muted small" data-i18n="ptz.zoom"></span>
            <button id="ptzZoomOut" data-i18n-title="ptz.zoomOut">－</button>
          </div>
        </div>
        <label><span><span data-i18n="ptz.speed"></span> <span id="ptzSpeedVal"></span></span>
          <input type="range" id="ptzSpeed" min="5" max="100" step="5" value="50">
        </label>
        <div id="ptzPresetRow" class="row">
          <select id="ptzPreset" class="grow"></select>
          <button id="ptzGoPreset" data-i18n="ptz.goto"></button>
          <button id="ptzReloadPresets" data-i18n-title="ptz.reload">↻</button>
        </div>
        <label id="ptzCenterRow" class="inline"><input type="checkbox" id="ptzClickCenter" checked> <span data-i18n="ptz.clickCenter"></span></label>
        <div class="muted small" data-i18n="ptz.keyboard"></div>
      </div>

      <div class="card">
        <h3 data-i18n="rec.title"></h3>
        <div id="recStatus" class="small" data-i18n="rec.loading"></div>
        <div id="recEnableRow" class="row hidden">
          <select id="recDisk" data-i18n-title="rec.disk.title"></select>
          <label class="inline"><input type="checkbox" id="recAudio"> <span data-i18n="rec.audio"></span></label>
          <button id="btnEnableRec" data-i18n="rec.enable"></button>
        </div>
        <div id="recDisableRow" class="row hidden">
          <button id="btnDisableRec" data-i18n-title="rec.disable.title">
            <svg class="icon" width="16" height="16"><use href="#ic-stop"/></svg><span data-i18n="rec.disable"></span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script>I18N.apply();</script>
  <script src="vendor/media-stream-library.min.js"></script>
  <script src="mkvconcat.js"></script>
  <script src="app.js"></script>
  <script src="ptz.js"></script>
</body>
</html>
